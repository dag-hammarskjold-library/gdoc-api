name: Build and push container to ECR and Lambda
on:
    release:
      types: [ released ]
  
jobs:
    deploy:
        name: Build Docker and Deploy Lambda
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
            ref: ${{github.ref}}

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with: 
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build, tag, and push the image to ECR
          id: build-image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: ${{ secrets.REPO_NAME }}
            IMAGE_TAG: latest
          run: |
            cd ./gdoc-dlx-lambda
            ref=`echo ${{github.ref}} |cut -d'/' -f 3`
            echo "gdoc-api @ git+https://github.com/dag-hammarskjold-library/gdoc-api@$ref" > requirements.txt
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            echo "Pushing image to ECR..."
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

        - name: Deploy image to Lambda
          id: deploy-image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: ${{ secrets.REPO_NAME }}
            IMAGE_TAG: latest
          run: |
            aws lambda update-function-code \
            --function-name gdoc-dlx-lambda \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

        - name: Update EventBridge Rules
          id: update-rules
          run: |
            while read -r loc day cron station; do
              RULE_NAME="gdoc-dlx-lambda-${loc}-${day}day"
              
              echo "Updating rule: $RULE_NAME"
              
              aws events put-rule \
                --name "$RULE_NAME" \
                --schedule-expression "cron($cron)"
                
              aws events put-targets \
                --rule "$RULE_NAME" \
                --targets "[{\"Id\":\"1\",\"Arn\":\"${{ secrets.FUNCTION_ARN }}\",\"Input\":\"{\\\"duty_station\\\":\\\"$station\\\",\\\"days_ago\\\":$day,\\\"description\\\":\\\"All $station documents from $day days ago.\\\"}\"}]"
                
            done <<EOF
            ny 1 "0 8 * * ? *" NY
            ny 2 "15 8 * * ? *" NY
            ny 3 "30 8 * * ? *" NY
            ge 1 "0 5 * * ? *" GE
            ge 2 "15 5 * * ? *" GE
            ge 3 "30 5 * * ? *" GE
            nairobi 1 "0 4 * * ? *" Nairobi
            nairobi 2 "15 4 * * ? *" Nairobi
            nairobi 3 "30 4 * * ? *" Nairobi
            vienna 1 "0 3 * * ? *" Vienna
            vienna 2 "15 3 * * ? *" Vienna
            vienna 3 "30 3 * * ? *" Vienna
            beirut 1 "0 1 * * ? *" Beirut
            beirut 2 "15 1 * * ? *" Beirut
            beirut 3 "30 1 * * ? *" Beirut
            bangkok 1 "0 19 * * ? *" Bangkok
            bangkok 2 "15 19 * * ? *" Bangkok
            bangkok 3 "30 19 * * ? *" Bangkok
            EOF