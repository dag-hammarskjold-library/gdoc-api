name: Build and push gdox-dlx-retro-lambda to ECR and Lambda
on:
    release:
      types: [ released ]
  
jobs:
    deploy:
        name: Build Docker and Deploy Lambda
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
            ref: ${{github.ref}}

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with: 
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build, tag, and push the image to ECR
          id: build-image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: gdoc-dlx-retro-lambda
            IMAGE_TAG: latest
          run: |
            cd ./gdoc-dlx-retro-lambda
            ref=`echo ${{github.ref}} |cut -d'/' -f 3`
            echo "gdoc-api @ git+https://github.com/dag-hammarskjold-library/gdoc-api@$ref" > requirements.txt
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            echo "Pushing image to ECR..."
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

        - name: Deploy image to Lambda
          id: deploy-image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: gdoc-dlx-retro-lambda
            IMAGE_TAG: latest
          run: |
            aws lambda update-function-code \
            --function-name gdoc-dlx-retro-lambda \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

        - name: Update EventBridge Rules
          id: update-rules
          run: |
            while IFS='|' read -r loc cron station; do
              RULE_NAME="gdoc-dlx-retro-lambda-${loc}"
              
              echo "Updating rule: $RULE_NAME"
              
              aws events put-rule \
                --name "$RULE_NAME" \
                --schedule-expression "cron($cron)"
                
              aws events put-targets \
                --rule "$RULE_NAME" \
                --targets "[{\"Id\":\"1\",\"Arn\":\"${{ secrets.RETRO_FUNCTION_ARN }}\",\"Input\":\"{\\\"duty_station\\\":\\\"$station\\\",\\\"description\\\":\\\"All retrospective $station documents.\\\"}\"}]"
                
            done <<EOF
            nairobi|*/5 * * * ? *|Nairobi
            beirut|*/5 * * * ? *|Beirut
            bangkok|*/5 * * * ? *|Bangkok
            ny|0 * * * ? *|NY
            ge|10 * * * ? *|GE
            EOF