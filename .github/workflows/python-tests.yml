# This workflow will install Python dependencies. This is a very basic test to make sure requirements are compatible with each other.
# To do: implement tests with pytest for additional assurance
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]
    
env:
  DLX_REST_TESTING: True

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{github.ref}}
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{github.ref}}

    - name: Build and run in Docker
      id: build-image
      run: |
        cd ./gdoc-dlx-lambda
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          ref="${{ github.event.pull_request.head.sha }}"
        else
          ref="${GITHUB_SHA}"
        fi
        echo "gdoc-api @ git+https://github.com/dag-hammarskjold-library/gdoc-api@$ref" > requirements.txt
        docker build -t python_test_image .
        docker run --rm --entrypoint python python_test_image -m pytest -vv
